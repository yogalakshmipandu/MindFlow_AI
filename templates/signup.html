{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MindFlow</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        .error {
            color: red;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: black;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Signup</h2>

    <!-- 🔥 Django backend errors -->
    {% if form.errors %}
        <div class="error">
            {{ form.errors }}
        </div>
    {% endif %}

    <form method="POST" onsubmit="return validateForm()">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" id="username" required minlength="3">

        <label>Password</label>
        <input type="password" name="password1" id="password1" required minlength="8">

        <label>Confirm Password</label>
        <input type="password" name="password2" id="password2" required>

        <!-- Frontend error -->
        <div id="error-msg" class="error"></div>

        <button type="submit">Create Account</button>
    </form>
</div>

<script>
function validateForm() {
    let username = document.getElementById("username").value;
    let password = document.getElementById("password1").value;
    let confirm = document.getElementById("password2").value;
    let error = document.getElementById("error-msg");

    error.innerHTML = "";

    // Username check
    if (username.length < 3) {
        error.innerHTML = "Username must be at least 3 characters";
        return false;
    }

    // Password length
    if (password.length < 8) {
        error.innerHTML = "Password must be at least 8 characters";
        return false;
    }

    // Not only numbers
    if (/^\d+$/.test(password)) {
        error.innerHTML = "Password cannot be only numbers";
        return false;
    }

    // Common weak passwords
    let weakPasswords = ["12345678", "password", "qwerty", "abc123"];
    if (weakPasswords.includes(password.toLowerCase())) {
        error.innerHTML = "Password is too common";
        return false;
    }

    // Match check
    if (password !== confirm) {
        error.innerHTML = "Passwords do not match";
        return false;
    }

    return true;
}
</script>

</body>
</html>
